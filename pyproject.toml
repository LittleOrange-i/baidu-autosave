[project]
name = "baidu-autosave"
version = "1.0.0"
description = "百度网盘自动转存工具"
requires-python = ">=3.10,<3.12"
dependencies = [
    "Flask==2.3.3",
    "Flask-Cors==4.0.0",
    "gevent==23.9.1",
    "APScheduler==3.10.4",
    "loguru==0.7.2",
    "requests==2.31.0",
    "pytz==2023.3.post1",
    "Cython==3.0.6",
    "baidupcs-py==0.7.6",
    "eventlet==0.35.1",
    "feedparser==6.0.10",
]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true